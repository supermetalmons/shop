[package]
name = "box_minter"
version = "0.1.0"
description = "mons.shop box minter – on-chain mint + supply cap for MPL Core (uncompressed) assets"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "box_minter"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
custom-heap = []
custom-panic = []
anchor-debug = []
solana = []
mainnet-program-id = []
localnet-program-id = []
testnet-program-id = []
card-nft-2-devnet-final-program-id = []
shared-devnet-program-id = []
little-swag-boxes-devnet-program-id = []
poncho-mainnet-program-id = []
poncho-devnet-program-id = []
sbf-tests = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "0.32.1" }
solana-sha256-hasher = "2.3.0"

[dev-dependencies]
litesvm = "=0.7.1"
solana-program-runtime = "=2.3.13"
solana-sdk = { version = "=2.3.1", default-features = false, features = ["full"] }

[[test]]
name = "split_payments_sbf"
path = "tests/split_payments_sbf.rs"
required-features = ["sbf-tests"]

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = ['cfg(target_os, values("solana"))']
