name: Card NFT 2 shared-program URI release

on:
  push:
    branches:
      - codex/card-nft-2-uri-rollout
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_IMAGE: solanafoundation/solana-verifiable-build@sha256:695f890e620db8c39afe5112e048599f8ee395a0cab5a2e572f30a72c6366cb4
  SOLANA_VERIFY_VERSION: 0.5.1
  RUST_TOOLCHAIN: 1.89.0
  HISTORICAL_COMMIT: 4ef953e66a21d64feb3b2e3964a0c3ca2477f832
  PROGRAM_ID: 7FGMn1z6TMi6ndyVooP9n1y3zuWhcrxfcJgcSQs6VNNU

jobs:
  verified-build:
    name: Verified build ${{ matrix.builder }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        builder: [a, b]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Install pinned Rust and solana-verify
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          cargo install solana-verify --version "$SOLANA_VERIFY_VERSION" --locked

      - name: Run Rust tests
        working-directory: onchain
        run: NO_DNA=1 cargo test --workspace --locked

      - name: Generate and compare Anchor IDLs
        if: matrix.builder == 'a'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libudev-dev
          cargo install anchor-cli --version 0.32.1 --locked
          mkdir -p onchain/target/idl onchain/target/types "$RUNNER_TEMP/card-baseline"
          (cd onchain && NO_DNA=1 anchor idl build --skip-lint -o target/idl/box_minter.json -t target/types/box_minter.ts -- --features mainnet-program-id)
          git archive "$HISTORICAL_COMMIT" | tar -x -C "$RUNNER_TEMP/card-baseline"
          mkdir -p "$RUNNER_TEMP/card-baseline/onchain/target/idl"
          (cd "$RUNNER_TEMP/card-baseline/onchain" && NO_DNA=1 anchor idl build --skip-lint -o target/idl/box_minter.json)
          node scripts/check-card-anchor-idl-compat.mjs \
            "$RUNNER_TEMP/card-baseline/onchain/target/idl/box_minter.json" \
            onchain/target/idl/box_minter.json \
            onchain/target/idl/compatibility-manifest.json
          cp "$RUNNER_TEMP/card-baseline/onchain/target/idl/box_minter.json" onchain/target/idl/box_minter.historical.json

      - name: Build deterministic mainnet ELF
        working-directory: onchain
        run: NO_DNA=1 solana-verify build --library-name box_minter --base-image "$BASE_IMAGE" -- --features mainnet-program-id,no-idl,no-log-ix-name

      - name: Assemble build artifact
        env:
          BUILDER: ${{ matrix.builder }}
        run: |
          mkdir -p "release-$BUILDER"
          cp onchain/target/deploy/box_minter.so "release-$BUILDER/box_minter.so"
          ELF_SHA256="$(sha256sum "release-$BUILDER/box_minter.so" | cut -d' ' -f1)"
          EXECUTABLE_HASH="$(solana-verify get-executable-hash "release-$BUILDER/box_minter.so")"
          IMAGE_REPO_DIGEST="$(docker image inspect "$BASE_IMAGE" --format '{{index .RepoDigests 0}}')"
          CONTAINER_TOOLS="$(docker run --rm "$BASE_IMAGE" bash -lc 'solana --version; cargo build-sbf --version' | tr '\n' ';')"
          jq -n \
            --arg builder "$BUILDER" \
            --arg sourceCommit "$GITHUB_SHA" \
            --arg programId "$PROGRAM_ID" \
            --arg baseImage "$BASE_IMAGE" \
            --arg imageRepoDigest "$IMAGE_REPO_DIGEST" \
            --arg solanaVerifyVersion "$(solana-verify --version)" \
            --arg rustVersion "$(rustc --version)" \
            --arg containerTools "$CONTAINER_TOOLS" \
            --arg cargoLockSha256 "$(sha256sum onchain/Cargo.lock | cut -d' ' -f1)" \
            --arg elfSha256 "$ELF_SHA256" \
            --arg executableHash "$EXECUTABLE_HASH" \
            '{builder:$builder,sourceCommit:$sourceCommit,programId:$programId,baseImage:$baseImage,imageRepoDigest:$imageRepoDigest,solanaVerifyVersion:$solanaVerifyVersion,rustVersion:$rustVersion,containerTools:$containerTools,cargoLockSha256:$cargoLockSha256,elfSha256:$elfSha256,executableHash:$executableHash}' \
            > "release-$BUILDER/build-manifest.json"
          jq -e 'all(.[]; . != null and . != "")' "release-$BUILDER/build-manifest.json"
          if [ "$BUILDER" = a ]; then
            cp onchain/target/idl/box_minter.json "release-$BUILDER/box_minter.idl.json"
            cp onchain/target/idl/box_minter.historical.json "release-$BUILDER/box_minter.historical.idl.json"
            cp onchain/target/types/box_minter.ts "release-$BUILDER/box_minter.idl.ts"
            cp onchain/target/idl/compatibility-manifest.json "release-$BUILDER/idl-compatibility-manifest.json"
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: card-nft-2-verified-build-${{ matrix.builder }}
          path: release-${{ matrix.builder }}
          if-no-files-found: error
          retention-days: 90

  compare:
    name: Require identical verified builds
    needs: verified-build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: card-nft-2-verified-build-a
          path: build-a
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: card-nft-2-verified-build-b
          path: build-b

      - name: Compare ELF bytes and assemble release
        run: |
          cmp build-a/box_minter.so build-b/box_minter.so
          HASH_A="$(sha256sum build-a/box_minter.so | cut -d' ' -f1)"
          HASH_B="$(sha256sum build-b/box_minter.so | cut -d' ' -f1)"
          test "$HASH_A" = "$HASH_B"
          mkdir -p card-nft-2-uri-migration-release
          cp build-a/box_minter.so card-nft-2-uri-migration-release/box_minter.so
          cp build-a/box_minter.idl.json card-nft-2-uri-migration-release/box_minter.idl.json
          cp build-a/box_minter.historical.idl.json card-nft-2-uri-migration-release/box_minter.historical.idl.json
          cp build-a/box_minter.idl.ts card-nft-2-uri-migration-release/box_minter.idl.ts
          cp build-a/idl-compatibility-manifest.json card-nft-2-uri-migration-release/idl-compatibility-manifest.json
          cp build-a/build-manifest.json card-nft-2-uri-migration-release/build-a-manifest.json
          cp build-b/build-manifest.json card-nft-2-uri-migration-release/build-b-manifest.json
          jq -n \
            --arg sourceCommit "$GITHUB_SHA" \
            --arg programId "$PROGRAM_ID" \
            --arg elfSha256 "$HASH_A" \
            --arg baseImage "$BASE_IMAGE" \
            --slurpfile buildA build-a/build-manifest.json \
            --slurpfile buildB build-b/build-manifest.json \
            '{sourceCommit:$sourceCommit,programId:$programId,elfSha256:$elfSha256,baseImage:$baseImage,identicalIndependentBuilds:true,builds:[$buildA[0],$buildB[0]]}' \
            > card-nft-2-uri-migration-release/hash-manifest.json
          jq -e '[.sourceCommit,.programId,.elfSha256,.baseImage] | all(. != null and . != "")' card-nft-2-uri-migration-release/hash-manifest.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: card-nft-2-uri-migration-release-${{ github.sha }}
          path: card-nft-2-uri-migration-release
          if-no-files-found: error
          retention-days: 90
